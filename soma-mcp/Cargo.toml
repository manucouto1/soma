[package]
name = "soma-mcp"
version.workspace = true
edition.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) server for Soma research platform"

[[bin]]
name = "soma-mcp"
path = "src/main.rs"

[dependencies]
soma-core = { version = "0.2.3", path = "../soma-core" }
soma-compiler = { version = "0.2.3", path = "../soma-compiler" }
soma-runtime = { version = "0.2.3", path = "../soma-runtime" }
soma-memory = { version = "0.2.3", path = "../soma-memory" }
soma-agent = { version = "0.2.3", path = "../soma-agent" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
