[workspace]
resolver = "2"
members = [
    "soma",
    "soma-core",
    "soma-store",
    "soma-compiler",
    "soma-runtime",
    "soma-macros",
    "soma-python",
    "soma-worker",
    "soma-memory",
    "soma-agent",
    "soma-llm",
    "soma-mcp",
    "soma-coordinator",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "Elastic-2.0"
repository = "https://github.com/manucouto1/soma"
description = "A computational graph runtime for research pipelines, agent orchestration, and data virtualization"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Hashing
sha2 = "0.10"
blake3 = "1"

# Canonical binary serialization (deterministic cache keys)
ciborium = "0.2"

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1"

# Logging
tracing = "0.1"

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"

# Proc macros
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Python bindings
pyo3 = { version = "0.24" }
numpy = { version = "0.24" }

# System info
sysinfo = "0.33"

# Object storage
object_store = { version = "0.12", features = ["aws"] }

# Compression
zstd = "0.13"

# Internal crates
somatize-macros = { version = "0.5.1", path = "soma-macros" }
somatize-core = { version = "0.5.1", path = "soma-core" }
somatize-store = { version = "0.5.1", path = "soma-store" }
somatize-compiler = { version = "0.5.1", path = "soma-compiler" }
somatize-runtime = { version = "0.5.1", path = "soma-runtime" }
somatize-memory = { version = "0.5.1", path = "soma-memory" }
somatize-worker = { version = "0.5.1", path = "soma-worker" }
somatize-agent = { version = "0.5.1", path = "soma-agent" }
somatize-llm = { version = "0.5.1", path = "soma-llm" }
somatize-mcp = { version = "0.5.1", path = "soma-mcp" }
somatize-coordinator = { version = "0.5.1", path = "soma-coordinator" }
