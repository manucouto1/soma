[workspace]
members = [
    "soma-core",
    "soma-data",
    "soma-fabric/broker",
    "soma-fabric/wire",
    "soma-health",
    "soma-python",
    "soma-store",
    "soma-study",
    "soma-tree",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Elastic-2.0"
repository = "https://github.com/manucouto1/soma"
# Inherited by every published crate, and resolved from here: cargo copies
# the file into each package and rewrites the path. `LICENSE` is not
# inherited the same way — a crate would have to drop the SPDX `license`
# to carry `license-file`, and that identifier is what crates.io indexes.
readme = "README.md"

[workspace.dependencies]
somatize-core = { path = "soma-core", version = "1.0.0" }
somatize-store = { path = "soma-store", version = "1.0.0" }
somatize-data = { path = "soma-data", version = "1.0.0" }
somatize-health = { path = "soma-health", version = "1.0.0" }
# The fabric, home from the repository it spent a day in. It is a family, so
# it is a folder: the wire carries a slice and the broker says where a host is.
somatize-fabric-wire = { path = "soma-fabric/wire", version = "1.0.0" }
somatize-fabric-broker = { path = "soma-fabric/broker", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
