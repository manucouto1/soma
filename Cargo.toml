[workspace]
members = ["core", "health", "python", "store", "study", "transport"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
repository = "https://github.com/manucouto1/soma-next"

[workspace.dependencies]
soma-next-core = { path = "core" }
soma-next-store = { path = "store" }
soma-next-health = { path = "health" }
serde = { version = "1", features = ["derive"] }
