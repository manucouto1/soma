[workspace]
resolver = "2"
members = [
    "soma",
    "soma-core",
    "soma-compiler",
    "soma-runtime",
    "soma-macros",
    "soma-python",
    "soma-worker",
    "soma-memory",
    "soma-agent",
    "soma-mcp",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "Elastic-2.0"
repository = "https://github.com/manucouto1/soma"
description = "A computational graph runtime for research pipelines, agent orchestration, and data virtualization"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
sha2 = "0.10"

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1"

# Logging
tracing = "0.1"

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"

# Proc macros
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Python bindings
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = { version = "0.24" }

# System info
sysinfo = "0.33"

# Object storage
object_store = { version = "0.12", features = ["aws"] }

# Compression
zstd = "0.13"

# Internal crates
soma-macros = { version = "0.2.6", path = "soma-macros" }
soma-core = { version = "0.2.6", path = "soma-core" }
soma-compiler = { version = "0.2.6", path = "soma-compiler" }
soma-runtime = { version = "0.2.6", path = "soma-runtime" }
soma-memory = { version = "0.2.6", path = "soma-memory" }
soma-worker = { version = "0.2.6", path = "soma-worker" }
soma-agent = { version = "0.2.6", path = "soma-agent" }
