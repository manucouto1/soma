[package]
name = "somatize-fabric-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
# The test binary lives under `tests/`, where cargo would also auto-discover it
# as an integration test. The test targets are declared below, all of them.
autotests = false

[lib]
name = "somatize_fabric_wire"

[dependencies]
somatize-core = { workspace = true, features = ["serde"] }
somatize-store = { workspace = true }
serde = { workspace = true }
# MessagePack, and the choice was measured: `postcard` drops the message of a
# custom serialization error — which here is the one saying why an opaque value
# cannot travel — and `bincode` writes more bytes. Self-describing also means the
# bytes can be read with any MessagePack tool when something goes wrong.
rmp-serde = "1" 

[dev-dependencies]
# The same one, so a test can write a message the way an **older** binary would
# have and check that this one still reads it. Nothing new in the tree.
rmp-serde = "1"

# The worker the tests use. A binary and not an `example` because a test needs to
# know its path, and `CARGO_BIN_EXE_` only exists for binaries — but its source
# lives under `tests/`, because `src/` is what the library is.
[[bin]]
name = "test-worker"
path = "tests/worker/main.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"
