[package]
name = "somatize"
version.workspace = true
edition.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
description = "Computational graph runtime for research pipelines, agent orchestration, and data virtualization"
keywords = ["graph", "ml", "optimization", "distributed", "pipeline"]
categories = ["science", "algorithms"]

[dependencies]
somatize-core = { workspace = true }
somatize-compiler = { workspace = true }
somatize-runtime = { workspace = true }
somatize-memory = { workspace = true }
somatize-worker = { workspace = true }
somatize-agent = { workspace = true }
somatize-llm = { workspace = true }
somatize-macros = { workspace = true }

[features]
default = []
s3 = ["somatize-core/s3"]
zarr = ["somatize-core/zarr"]
chronos = ["somatize-memory/chronos"]
full = ["s3", "zarr", "chronos"]
