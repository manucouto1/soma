[package]
name = "soma"
version.workspace = true
edition.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
description = "Computational graph runtime for research pipelines, agent orchestration, and data virtualization"
keywords = ["graph", "ml", "optimization", "distributed", "pipeline"]
categories = ["science", "algorithms"]

[dependencies]
soma-core = { workspace = true }
soma-compiler = { workspace = true }
soma-runtime = { workspace = true }
soma-memory = { workspace = true }
soma-worker = { workspace = true }
soma-agent = { workspace = true }
soma-macros = { workspace = true }

[features]
default = []
s3 = ["soma-core/s3"]
zarr = ["soma-core/zarr"]
chronos = ["soma-memory/chronos"]
full = ["s3", "zarr", "chronos"]
