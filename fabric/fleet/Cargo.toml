[package]
name = "soma-fabric-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Where the workers are, what they can do, and what they are doing."
# The same as the other two: every test target is declared rather than
# auto-discovered.
autotests = false

[lib]
name = "soma_fabric_fleet"

[[bin]]
name = "soma-fabric-fleet"
path = "src/main.rs"

[dependencies]
# For `Host`, which is the name half of everything here.
soma-next-core = { workspace = true, features = ["serde"] }
# The store is the only thing this reads. It does not talk to a worker.
soma-next-store = { workspace = true }
# For `Machine` and where a reading is filed. The reading's format has one
# owner and it is over there — this crate must never learn to parse one itself.
soma-fabric-wire = { path = "../wire" }
# For `Path` and, more to the point, for who decides that two names are one
# wire. The listing is grouped by asking a real broker rather than by this crate
# working it out again — the day the local one holds the listing, that is a move.
soma-fabric-broker = { path = "../broker" }
serde = { workspace = true }
# The record's blob is JSON on purpose: "whoever reads a record is another
# process, often on another machine and sometimes a notebook".
serde_json = "1"
# The listing is a file somebody may want to edit by hand, so it is TOML — the
# same choice, for the same reason, as soma-tree's own configuration.
toml = "0.8"
# The versions soma-tree runs, which are chatty-the-lab's. The day this becomes
# a panel there, these are routes that move and not a server that is rewritten.
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[test]]
name = "unit"
path = "tests/unit/main.rs"
