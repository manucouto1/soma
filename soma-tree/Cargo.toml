[package]
name = "somatize-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "What an edit did to a graph, said before anybody runs it."

[lib]
name = "somatize_tree"
path = "src/lib.rs"

[[bin]]
name = "somatize-tree"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
# For `Key` and `NodeId`, which arrive as the engine's own serde form. Nothing
# else of the core is needed here: this reads what a probe wrote down, and the
# probe is the only thing that ever holds a graph.
somatize-core = { workspace = true, features = ["serde"] }
somatize-store = { workspace = true }
serde = { workspace = true }
# Behind a feature, and the feature is on by default so a plain `cargo install`
# still gets the command. It matters for the other tenant: `soma-python` links
# this crate for the reasoning, and a wheel has no use for an argument parser.
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
toml = "0.8"
tempfile = "3"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "end_to_end"
path = "tests/end_to_end/main.rs"
