[package]
name = "somatize-worker"
version.workspace = true
edition.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
description = "Worker daemon for distributed execution in the Soma runtime"

[dependencies]
somatize-core = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"], optional = true }
somatize-compiler = { workspace = true }
somatize-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
sysinfo = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = "0.3"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rmp-serde = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[features]
default = []
embedded-python = ["dep:pyo3"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
