[package]
name = "somatize-macros"
version.workspace = true
edition.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
description = "Derive macros for the Soma computational graph runtime"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
trybuild = "1"
# Path only, and deliberately NOT `workspace = true`: inheriting the
# workspace entry brings its version along, and a versioned
# dev-dependency survives into the published manifest. That makes a cycle
# nothing can break — `somatize-macros` would need `somatize-core` at the
# release version to publish, and `somatize-core` needs
# `somatize-macros` at it, so neither can go first and the whole release
# is stuck. This is what held up 0.4.0.
#
# Cargo strips a dev-dependency with no version at publish time, which is
# why the published 0.3.1 manifest lists three dependencies and no dev
# ones. Local `cargo test` is unaffected: the path is all it ever needed.
somatize-core = { path = "../soma-core" }
serde = { workspace = true }
