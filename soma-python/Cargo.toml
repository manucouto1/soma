[package]
name = "soma-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Soma computational graph runtime"

[lib]
name = "_soma"
crate-type = ["cdylib"]

[dependencies]
somatize-core = { workspace = true, features = ["s3"] }
somatize-compiler = { workspace = true }
somatize-runtime = { workspace = true }
somatize-worker = { workspace = true, features = ["embedded-python"] }
pyo3 = { workspace = true, features = ["extension-module"] }
tokio = { workspace = true }
hostname = "0.4"
numpy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rmp-serde = "1"
