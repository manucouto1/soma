[package]
name = "somatize-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_somatize"
crate-type = ["cdylib"]

[dependencies]
somatize-core = { workspace = true, features = ["serde"] }
# The wire, from `fabric/`. It spent a day in a repository of its own and came
# back: everything that versions together lives together, and a path dependency
# across two repositories makes releasing one wait on the other's uncommitted
# state.
somatize-fabric-wire = { workspace = true, optional = true }
# The rendezvous. It is what fills the `Transport` hole now that a client talks
# to a broker instead of holding a dictionary of workers.
somatize-fabric-broker = { workspace = true, optional = true }
# With `s3`, because a study spread over machines with no shared mount is
# exactly the case `somatize.Store.on_bucket` exists for.
somatize-store = { workspace = true, features = ["s3"] }
# A source is a Rust node, and a frame is what it answers with: this side
# translates both, which is what `python/` is for.
somatize-data = { path = "../soma-data", version = "1.0.1" }
# To hand one column over as plain Python values, so that a worker with no
# dataframe library in it can still read a column of text.
arrow-array = "59"
arrow-schema = "59"
somatize-study = { path = "../soma-study", version = "1.0.1" }
# The verdict: numbers in, flags out, and no dependencies of its own.
somatize-health = { workspace = true }
# The reasoning, read back. `default-features = false` on purpose: the feature
# it drops is `cli`, and a wheel has no use for an argument parser.
somatize-tree = { workspace = true }
# The plan travels to Python as data so that whoever draws it does not have
# to parse a `Debug`. JSON and not MessagePack: the reader is `json.loads`,
# which is stdlib, and nobody has to install anything to look at a shape.
serde_json = "1"
# `abi3-py310` and not one wheel per interpreter: the limited API means a
# single build answers for 3.10 and everything after it, including versions
# that did not exist when it was compiled. It is on here rather than only in
# the release build so that `maturin develop` produces the same artifact the
# release does — an ABI the tests never exercise is an ABI nobody checked.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }

# The wire, and it is optional so that the seam is a fact the compiler checks
# rather than a claim in a document. `--no-default-features` builds the whole
# library with no transport at all: if that compiles, moving `transport/` to a
# repository of its own is a `git mv` and not a redesign.
[features]
default = ["remote"]
remote = ["dep:somatize-fabric-wire", "dep:somatize-fabric-broker"]
