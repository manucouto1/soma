# cargo-release configuration
# Install: cargo install cargo-release
# Usage: cargo release patch/minor/major

[workspace]
# All crates share the same version
shared-version = true
# Consolidate commits and tags
consolidate-commits = true
# Tag format
tag-name = "v{{version}}"
# Commit message
pre-release-commit-message = "chore: release v{{version}}"
# Push to remote
push = true
# Publish to crates.io
publish = true
# Create git tag
tag = true

# Publish order (respects dependency graph)
[[package]]
name = "soma-macros"

[[package]]
name = "soma-core"

[[package]]
name = "soma-compiler"

[[package]]
name = "soma-runtime"

[[package]]
name = "soma-memory"

[[package]]
name = "soma-worker"

[[package]]
name = "soma-agent"

# soma-python is published via maturin, not cargo-release
[[package]]
name = "soma-python"
publish = false
