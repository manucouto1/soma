name: Worker Image

# One workflow and one build for two jobs that would otherwise be the same
# build twice: the smoke test that says the Dockerfile still works, and the
# image somebody pulls. Fusing them means what gets published is what was
# tested, rather than a second build that happens to look like it.
#
# What differs is only whether it is pushed, which is the `push:` line below.
on:
  # Only when something the image is made of moved. The Dockerfile copies the
  # manifests crate by crate, so adding a member to the workspace and
  # forgetting this file breaks the image with every other job still green —
  # and the root `Cargo.toml` is what catches exactly that.
  #
  # The list is written twice because GitHub Actions does not read YAML
  # anchors: `paths: *sources` parses as a workflow with no path filter at
  # all, which is the failure that runs this on every commit instead of none.
  pull_request:
    branches: [main]
    paths:
      - "soma-python/docker/**"
      - "soma-python/pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/worker-image.yml"
  push:
    branches: [main]
    paths:
      - "soma-python/docker/**"
      - "soma-python/pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/worker-image.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/somatize-worker

jobs:
  worker:
    name: Build (and publish on a release)
    runs-on: ubuntu-latest

    # `packages: write` is declared here and used by one conditional step. A
    # pull request from a fork gets a read-only token whatever this block says,
    # so a fork cannot push with it; what this buys is that nothing else in the
    # workflow inherits the scope.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the registry
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha

      # The CPU stage only. `worker-gpu` is not built here and not published:
      # eleven gigabytes do not fit on a runner, and it is this image plus one
      # `uv pip install torch`. Whoever needs it builds it with
      # `--target worker-gpu`, which is what the cluster suite does.
      #
      # Built once, `load`ed rather than pushed, so that the next step has an
      # image to start. What gets published later is this very image retagged,
      # not a second build that happens to look like it.
      - name: Build the worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: soma-python/docker/worker.Dockerfile
          target: worker
          load: true
          tags: somatize-worker:just-built
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A worker that builds but cannot start is an image nobody finds out
      # about until a cluster will not come up. This is the one thing a smoke
      # test can check without the suite: that the wheel inside it imports, and
      # that the module the compose file names as the entry point is there.
      - name: It runs
        run: |
          docker run --rm somatize-worker:just-built python -c \
            "import somatize, somatize.worker; print('somatize', somatize.__version__)"

      # Retagged and pushed, never rebuilt. `docker/metadata-action` writes one
      # tag per line, which is why this is a loop and not an argument.
      - name: Publish
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag somatize-worker:just-built "$tag"
            docker push "$tag"
          done
