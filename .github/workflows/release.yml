name: Release

on:
  push:
    tags:
      - "v*"

# The file is still called `release.yml`, and that is load-bearing. A trusted
# publisher on crates.io and on PyPI is keyed to a repository **and a workflow
# file name**: `somatize-core` and `somatize-store` already have one from when
# this repository published 0.5.x, and renaming this file would silently stop
# matching it.

# A floor of read, raised per job: only `github-release` writes to the
# repository, and only the two publishing jobs mint an OIDC token. Declaring
# `contents: write` + `id-token: write` at the top would hand both to every
# job, including any added later.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Setup Python for PyO3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Point PyO3 at the pinned interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # Trusted publishing: exchange this run's OIDC identity for a token that
      # lives for the length of the job and is revoked in the action's post
      # step. Replaces a permanent CARGO_REGISTRY_TOKEN secret.
      #
      # REQUIRES a trusted publisher configured on crates.io for each crate,
      # and a crate that has NEVER been published cannot have one: crates.io
      # keys the config to a crate id and has no "pending publisher" for a name
      # that does not exist. Seven of the nine below are in that position —
      # everything except `somatize-core` and `somatize-store`, which carry
      # theirs over from 0.5.x. They need a one-time `cargo publish` with a
      # token before this workflow can ever succeed. See RELEASING.md.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          # Nine, in dependency order, and it is the whole of what this
          # workspace publishes. `somatize-python` is deliberately absent: it
          # is a cdylib, so nothing can depend on it from Rust, and it carries
          # `publish = false`. Its artifact is the wheel, in the job below.
          #
          # The eleven names the old repository published are not here either.
          # Eight of them — `-agent`, `-llm`, `-mcp`, `-coordinator`,
          # `-compiler`, `-macros`, `-memory`, `-worker` — plus `-runtime` and
          # the `somatize` facade have no counterpart in this design and simply
          # stop publishing a version. Nothing has to be done with them:
          # crates.io versions are immutable, so whoever pinned 0.5.1 keeps it.
          CRATES="
            somatize-core
            somatize-health
            somatize-study
            somatize-store
            somatize-data
            somatize-tree
            somatize-fabric-wire
            somatize-fabric-broker
            somatize-fabric-fleet
          "

          # Re-running a release must not fail on the crates that already went
          # out, but that is the ONLY failure worth swallowing. Anything else —
          # a compile error, an unpublished dependency, a rejected token —
          # fails the job. The old repository ended every line in `|| true`,
          # and the result was three crates the facade needed that had never
          # been published and nobody knew.
          #
          # No `--allow-dirty`: the checkout of a tag is clean, and a tree that
          # is not is something to hear about rather than to publish around.
          for crate in $CRATES; do
            echo "::group::publish $crate"
            if output=$(cargo publish -p "$crate" 2>&1); then
              echo "$output"
            elif grep -qE 'already (exists|uploaded)' <<<"$output"; then
              echo "$output"
              echo "$crate is already on crates.io at this version — skipping"
            else
              echo "$output"
              echo "::error::publishing $crate failed"
              exit 1
            fi
            echo "::endgroup::"
            # cargo already blocks until the crate appears in the index, so
            # this is belt and braces against a slow propagation making the
            # next crate fail for a reason that is not its own.
            sleep 15
          done

  # Wheel + sdist AND the upload in a single job, so nothing passes through
  # GitHub artifact storage.
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ONE wheel, not four. `somatize-python` builds against pyo3's limited
      # API (`abi3-py310`), so a single `cp310-abi3` wheel answers for 3.10 and
      # everything after it, including interpreters that did not exist when it
      # was compiled. The interpreter named here only decides what compiles the
      # extension; the tag it gets is decided by the feature.
      - name: Build the manylinux wheel via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/io" \
            -w /io/soma-python \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            ghcr.io/pyo3/maturin@sha256:2665227312dd1eab1c29c70a001dc8aac53155a2d048bede3b2df7f1691c8e38 \
            build --release --out /io/dist --interpreter python3.13

      - name: Reclaim ownership (Docker writes as root)
        run: |
          docker run --rm -v "${{ github.workspace }}:/io" alpine \
            chown -R "$(id -u):$(id -g)" /io || true

      # The source distribution is what lets somebody on a platform we do not
      # publish a wheel for build one, and it only resolves because every path
      # dependency in this workspace carries a `version` beside its `path`.
      - name: Build the sdist
        run: |
          pip install maturin
          maturin sdist -m soma-python/Cargo.toml --out dist

      - name: What is going out
        run: ls -la dist/

      # Trusted publishing, same idea as crates.io: the OIDC identity of this
      # run IS the credential, so there is no PYPI_API_TOKEN to leak or rotate.
      # REQUIRES a trusted publisher on PyPI for the `somatize` project,
      # pointing at this repository and at this file's name.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Last, and only if both publishing jobs got there. Creating the
      # release is also what triggers `worker-image.yml`, so no image is cut
      # for a version that failed to go out. The image builds its wheel from
      # this tree rather than from PyPI, so what the ordering buys is that a
      # published image always names a version that exists.
      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
