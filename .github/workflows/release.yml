name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # Publish Rust crates to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p somatize-macros --allow-dirty || true
          sleep 30
          cargo publish -p somatize-core --allow-dirty || true
          sleep 30
          cargo publish -p somatize-compiler --allow-dirty || true
          sleep 30
          cargo publish -p somatize-runtime --allow-dirty || true
          sleep 30
          cargo publish -p somatize-memory --allow-dirty || true
          sleep 30
          cargo publish -p somatize-worker --allow-dirty || true
          sleep 30
          cargo publish -p somatize-agent --allow-dirty || true
          sleep 30
          cargo publish -p somatize --allow-dirty || true

  # Build wheels + sdist AND publish to PyPI in a single job, so nothing is
  # passed through GitHub artifact storage (avoids the artifact storage quota).
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheels via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/io" \
            -w /io/soma-python \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            ghcr.io/pyo3/maturin:latest \
            build --release --out /io/dist --interpreter python3.12 python3.13

      - name: Reclaim ownership (Docker writes as root)
        run: |
          docker run --rm -v "${{ github.workspace }}:/io" alpine \
            chown -R "$(id -u):$(id -g)" /io || true

      - name: Build sdist
        run: |
          pip install maturin
          maturin sdist -m soma-python/Cargo.toml --out dist

      - name: List dist contents
        run: ls -la dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --skip-existing dist/*

  # Create GitHub Release
  github-release:
    name: GitHub Release
    needs: [publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
