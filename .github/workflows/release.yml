name: Release

on:
  push:
    tags:
      - "v*"

# A floor of read, raised per job: only `github-release` writes to the
# repository, and only the two publishing jobs mint an OIDC token. Declaring
# `contents: write` + `id-token: write` at the top handed both to every job,
# including any added later.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # Publish Rust crates to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing: exchange this run's OIDC identity for a token
      # that lives for the length of the job and is revoked in the action's
      # post step. Replaces a permanent CARGO_REGISTRY_TOKEN secret.
      # REQUIRES a trusted publisher configured on crates.io for each crate
      # (repository + workflow file name); without it this step fails, which
      # is the loud failure we want rather than a silent one.
      #
      # And a crate that has NEVER been published cannot have one: crates.io
      # keys the config to a crate id and has no "pending publisher" for a
      # name that does not exist yet. somatize-store, somatize-llm and
      # somatize-coordinator are in that position — see RELEASING.md for the
      # one-time token publish that puts them there.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          # Every crate the facade needs, in dependency order. Three were
          # missing — somatize-store, somatize-llm and somatize-coordinator —
          # and `somatize` depends on all three, so publishing the facade
          # could not have succeeded. Nobody found out, because every line
          # ended in `|| true`. somatize-mcp is deliberately absent: nothing
          # depends on it and it is run as a binary.
          CRATES="
            somatize-macros
            somatize-core
            somatize-store
            somatize-compiler
            somatize-runtime
            somatize-memory
            somatize-llm
            somatize-worker
            somatize-agent
            somatize-coordinator
            somatize
          "

          # Re-running a release must not fail on the crates that already
          # went out, but that is the ONLY failure worth swallowing. Anything
          # else — a compile error, an unpublished dependency, a rejected
          # token — fails the job.
          for crate in $CRATES; do
            echo "::group::publish $crate"
            if output=$(cargo publish -p "$crate" --allow-dirty 2>&1); then
              echo "$output"
            elif grep -qE 'already (exists|uploaded)' <<<"$output"; then
              echo "$output"
              echo "$crate is already on crates.io at this version — skipping"
            else
              echo "$output"
              echo "::error::publishing $crate failed"
              exit 1
            fi
            echo "::endgroup::"
            # cargo already blocks until the crate appears in the index, so
            # this is belt and braces against a slow propagation making the
            # next crate fail for a reason that is not its own.
            sleep 15
          done

  # Build wheels + sdist AND publish to PyPI in a single job, so nothing is
  # passed through GitHub artifact storage (avoids the artifact storage quota).
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheels via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/io" \
            -w /io/soma-python \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            ghcr.io/pyo3/maturin@sha256:2665227312dd1eab1c29c70a001dc8aac53155a2d048bede3b2df7f1691c8e38 \
            build --release --out /io/dist --interpreter python3.12 python3.13

      - name: Reclaim ownership (Docker writes as root)
        run: |
          docker run --rm -v "${{ github.workspace }}:/io" alpine \
            chown -R "$(id -u):$(id -g)" /io || true

      - name: Build sdist
        run: |
          pip install maturin
          maturin sdist -m soma-python/Cargo.toml --out dist

      - name: List dist contents
        run: ls -la dist/

      # Trusted publishing, same idea as the crates.io job: the OIDC identity
      # of this run IS the credential, so there is no PYPI_API_TOKEN to leak
      # or rotate. REQUIRES a trusted publisher configured on PyPI for the
      # `somatize` project, pointing at this repository and this workflow
      # file name.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # Create GitHub Release
  github-release:
    name: GitHub Release
    needs: [publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
