name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # Publish Rust crates to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p somatize-macros --allow-dirty || true
          sleep 30
          cargo publish -p somatize-core --allow-dirty || true
          sleep 30
          cargo publish -p somatize-compiler --allow-dirty || true
          sleep 30
          cargo publish -p somatize-runtime --allow-dirty || true
          sleep 30
          cargo publish -p somatize-memory --allow-dirty || true
          sleep 30
          cargo publish -p somatize-worker --allow-dirty || true
          sleep 30
          cargo publish -p somatize-agent --allow-dirty || true
          sleep 30
          cargo publish -p somatize --allow-dirty || true

  # Build Linux wheels via Docker
  build-linux:
    name: Build Linux wheels
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheels via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/io" \
            -w /io/soma-python \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            ghcr.io/pyo3/maturin:latest \
            build --release --out /io/dist --interpreter python3.12 python3.13

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl

  # Build sdist
  build-sdist:
    name: Build sdist
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        working-directory: soma-python
        run: |
          pip install maturin
          maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: soma-python/dist/*.tar.gz

  # Upload to PyPI
  upload-pypi:
    name: Upload to PyPI
    needs: [build-linux, build-sdist]
    runs-on: self-hosted
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List dist contents
        run: ls -la dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  # Create GitHub Release
  github-release:
    name: GitHub Release
    needs: [publish-crates, upload-pypi]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
