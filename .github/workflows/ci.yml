name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

# Least privilege, declared here rather than inherited. The repository default
# is already read-only, but that is a setting anyone with admin can change from
# the UI; this file is the record. No job here needs to write anything.
permissions:
  contents: read

# Cancel superseded runs on a pull request — pushing three times in a minute
# should not queue three 40-minute runs. A push to a branch is NOT cancelled:
# that run is the record for that commit, and main's history deserves one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy

      # NOT actions/cache over `target`. That is what killed a run on main:
      # 13 crates after --workspace tests plus the feature-gated checks make
      # a target/ far larger than the ~14 GB an ubuntu runner has free, and
      # the post-step has to compress it, needing the space twice over. The
      # runner died with "No space left on device" AFTER every test had
      # passed. rust-cache caches the registry and the dependency artifacts
      # but prunes the workspace's own crates — which are rebuilt anyway —
      # and derives its own key.
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      # PyO3 0.24 supports up to Python 3.13; runner defaults (e.g.
      # macos-latest) may already ship 3.14.
      - name: Setup Python for PyO3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point PyO3 at the pinned interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # See the note on the first of these.
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: test

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (with chronos feature)
        run: cargo test -p somatize-memory --features chronos

      # `cargo test --workspace` builds default features only, so a type
      # change can pass everything above and still break code behind a
      # feature gate — which is exactly how the chronos build broke once.
      - name: cargo check (every feature-gated path)
        run: |
          cargo check -p somatize-store --all-features
          cargo check -p somatize --features full

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-cov numpy cloudpickle safetensors pandas mypy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install soma
        run: |
          source .venv/bin/activate
          cd soma-python && maturin develop

      # The package ships `py.typed`, so what it claims about itself is
      # public API. `tests/test_stubs.py` checks the stub against the
      # module that was just built; this checks the rest of the package
      # against the stub.
      - name: mypy
        run: |
          source .venv/bin/activate
          cd soma-python && mypy

      - name: Run Python tests (with coverage)
        run: |
          source .venv/bin/activate
          cd soma-python && pytest tests/ -v --cov=soma --cov-report=term

      - name: Run slow robustness tests
        run: |
          source .venv/bin/activate
          cd soma-python && pytest tests/ -v -m slow

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Build the Starlight site here too: without this, a broken docs
      # build (or a sidebar entry pointing at a deleted page) is only
      # discovered by the deploy workflow on main.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs site
        run: |
          cd docs
          npm ci
          npm run check    # sidebar reachability + astro build

  coverage-rust:
    name: Rust Coverage (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup Python for PyO3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point PyO3 at the pinned interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # Both this action and rust-toolchain above select what they install
      # from the *ref* (@cargo-llvm-cov, @stable). Pinning the ref to a SHA
      # therefore drops the selection — it has to move into `with:`, or the
      # action installs nothing and the step fails.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@faf6515f98a6da02430741fd0af1094fde82286d # cargo-llvm-cov branch @ 2026-08-05
        with:
          tool: cargo-llvm-cov

      # See the note on the first of these.
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: cov

      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --no-fail-fast --summary-only
