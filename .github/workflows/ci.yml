name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # PyO3 0.24 supports up to Python 3.13; runner defaults (e.g.
      # macos-latest) may already ship 3.14.
      - name: Setup Python for PyO3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point PyO3 at the pinned interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (with chronos feature)
        run: cargo test -p somatize-memory --features chronos

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-cov numpy cloudpickle safetensors pandas
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install soma
        run: |
          source .venv/bin/activate
          cd soma-python && maturin develop

      - name: Run Python tests (with coverage)
        run: |
          source .venv/bin/activate
          cd soma-python && pytest tests/ -v --cov=soma --cov-report=term

      - name: Run slow robustness tests
        run: |
          source .venv/bin/activate
          cd soma-python && pytest tests/ -v -m slow

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Build the Starlight site here too: without this, a broken docs
      # build (or a sidebar entry pointing at a deleted page) is only
      # discovered by the deploy workflow on main.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs site
        run: |
          cd docs
          npm ci
          npm run check    # sidebar reachability + astro build

  coverage-rust:
    name: Rust Coverage (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Python for PyO3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point PyO3 at the pinned interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --no-fail-fast --summary-only
