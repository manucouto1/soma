name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build cargo doc (Rust API reference)
      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "--default-theme ayu"

      # Build Starlight docs
      - name: Install docs dependencies
        run: cd docs && npm ci

      - name: Build Starlight site
        run: cd docs && npm run build

      # Copy cargo doc output into Starlight's dist
      - name: Integrate Rust API docs
        run: |
          mkdir -p docs/dist/api
          cp -r target/doc/* docs/dist/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  # Gated on a repository variable, not on the build: `build` above IS the check
  # (it fails if cargo doc or Starlight break), and it runs on every push. The
  # deploy cannot: this repository is private, and GitHub Pages on a private
  # repository needs a paid plan — the API answers 422 "Your current plan does
  # not support GitHub Pages for this repository", so `deploy-pages` 404s on
  # every push and paints the workflow red for a reason that is not the code.
  # To turn deployment on: enable Pages (make the repository public, or upgrade
  # the plan), then set the repository variable PAGES_ENABLED to "true".
  deploy:
    name: Deploy to Pages
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
