name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Rust API reference to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Setup Python for PyO3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Point PyO3 at the pinned interpreter
        run: echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # Narrower than the same command in `ci.yml`, and deliberately so. There
      # the point is that nothing warns, so it documents every target, test
      # binaries included. Here the point is what a reader gets, and a reader
      # has no use for `test_worker` — the wire's fixture — or for `_somatize`,
      # which is the extension module: its API is Python's, and documenting the
      # cdylib puts a page of Rust in front of it that says nothing true about
      # how it is used.
      - name: Build the API reference
        run: cargo doc --workspace --no-deps --lib --exclude somatize-python

      # `cargo doc` writes no index for a workspace: it lands nine crate
      # directories and nothing that points at them, so Pages would serve a
      # 404 at the root. There is no facade crate to redirect to either, and
      # picking one would be a lie about where to start.
      - name: A front page, since a workspace has none
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>somatize — API reference</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            :root { color-scheme: light dark;
                    font: 16px/1.6 system-ui, -apple-system, sans-serif; }
            body { max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; }
            h1 { font-size: 1.6rem; margin-bottom: .25rem; }
            p.sub { margin-top: 0; opacity: .7; }
            ul { list-style: none; padding: 0; }
            li { padding: .45rem 0; border-bottom: 1px solid rgba(128,128,128,.2); }
            code { font-size: .95em; }
            span { opacity: .7; }
          </style>
          <h1>somatize</h1>
          <p class="sub">The Rust API reference. The Python package is
            <code>pip install somatize</code>.</p>
          <ul>
            <li><a href="somatize_core/index.html"><code>somatize-core</code></a>
              — <span>the graph, the plan and what running one means</span></li>
            <li><a href="somatize_store/index.html"><code>somatize-store</code></a>
              — <span>where a computed value is kept, on a disk or in a bucket</span></li>
            <li><a href="somatize_data/index.html"><code>somatize-data</code></a>
              — <span>where the data comes from, a column at a time</span></li>
            <li><a href="somatize_study/index.html"><code>somatize-study</code></a>
              — <span>a search over configurations, and what each trial did</span></li>
            <li><a href="somatize_health/index.html"><code>somatize-health</code></a>
              — <span>numbers in, flags out: whether a network is learning</span></li>
            <li><a href="somatize_tree/index.html"><code>somatize-tree</code></a>
              — <span>what an edit did to a graph, said before anybody runs it</span></li>
            <li><a href="somatize_fabric_wire/index.html"><code>somatize-fabric-wire</code></a>
              — <span>the cable: a slice of work, carried to another machine</span></li>
            <li><a href="somatize_fabric_broker/index.html"><code>somatize-fabric-broker</code></a>
              — <span>which host a name resolves to</span></li>
          </ul>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

      # No `PAGES_ENABLED` gate any more. Legacy had one because that repository
      # was private and Pages on a private repository needs a paid plan, so the
      # deploy 404'd on every push and painted the workflow red for a reason
      # that was not the code. This repository is public and Pages is already
      # configured with `build_type: workflow`, so the deploy is simply allowed.
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
