[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "soma-next"
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
dynamic = ["version"]

[tool.maturin]
module-name = "soma_next._soma_next"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
