[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "soma-next"
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
dynamic = ["version"]

# `cloudpickle` is only needed for the generic worker — the one that starts empty
# and receives the nodes over the wire. A local graph, or a worker that already
# knows its catalog, never touch it.
[project.optional-dependencies]
remote = ["cloudpickle>=3"]

[tool.maturin]
module-name = "soma_next._soma_next"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
