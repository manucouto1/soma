[package]
name = "soma-next-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_soma_next"
crate-type = ["cdylib"]

[dependencies]
soma-next-core = { workspace = true, features = ["serde"] }
soma-next-transport = { path = "../transport", optional = true }
# With `s3`, because a study spread over machines with no shared mount is
# exactly the case `soma_next.Store.on_bucket` exists for.
soma-next-store = { workspace = true, features = ["s3"] }
# A source is a Rust node, and a frame is what it answers with: this side
# translates both, which is what `python/` is for.
soma-next-data = { path = "../data" }
# To hand one column over as plain Python values, so that a worker with no
# dataframe library in it can still read a column of text.
arrow-array = "59"
arrow-schema = "59"
soma-next-study = { path = "../study" }
# The verdict: numbers in, flags out, and no dependencies of its own.
soma-next-health = { workspace = true }
# The plan travels to Python as data so that whoever draws it does not have
# to parse a `Debug`. JSON and not MessagePack: the reader is `json.loads`,
# which is stdlib, and nobody has to install anything to look at a shape.
serde_json = "1"
pyo3 = { version = "0.24", features = ["extension-module"] }

# The wire, and it is optional so that the seam is a fact the compiler checks
# rather than a claim in a document. `--no-default-features` builds the whole
# library with no transport at all: if that compiles, moving `transport/` to a
# repository of its own is a `git mv` and not a redesign.
[features]
default = ["remote"]
remote = ["dep:soma-next-transport"]
