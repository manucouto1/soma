# A cluster that is not a metaphor: three hosts, each its own process, its own
# filesystem and its own name, on a network of their own.
#
#   SOMA_CLUSTER=1 python -m pytest tests/cluster -q
#
# It lives beside the tests it exists for, and nowhere else uses it. The build
# context is still the repository, because the image is built from the source:
# what is far away here is the root, not the fixtures.
#
# And a **second** context, `fabric`, since the wire and the broker left for
# `soma-fabric`. Two contexts and not one root over both, because the root over
# both is a directory of unrelated projects and every byte of it would be sent
# to the daemon. The two repositories move together, which is the same thing
# the path dependencies in `python/Cargo.toml` already assume.
#
# The client is pytest, **outside**: that is the real shape — whoever declares
# the graph is not one of the workers.

name: soma-cluster

services:
  # Two ordinary workers, sharing a store. Neither has a line of your code.
  worker-a:
    build: &worker
      context: ../../../..
      dockerfile: python/tests/cluster/docker/worker.Dockerfile
      additional_contexts:
        fabric: ../../../../../soma-fabric
      target: worker
    command: &keeping ["python", "-m", "soma_next.worker", "--listen", "0.0.0.0:7000", "--store", "/store"]
    ports: ["127.0.0.1:7001:7000"]
    volumes: ["store:/store", "../clone:/clone:ro"]

  worker-b:
    build: *worker
    command: *keeping
    ports: ["127.0.0.1:7002:7000"]
    volumes: ["store:/store", "../clone:/clone:ro"]

  # The same worker with the code at **another version**. It stops rather than
  # run something that is not what the graph was written against.
  worker-old:
    build: *worker
    ports: ["127.0.0.1:7003:7000"]
    volumes: ["../clone_old:/clone:ro"]

  # And the same one told to take its chances, which is the other half of the
  # knob: it runs its own version and says so.
  worker-lucky:
    build: *worker
    command: ["python", "-m", "soma_next.worker", "--listen", "0.0.0.0:7000", "--lucky"]
    ports: ["127.0.0.1:7005:7000"]
    volumes: ["../clone_old:/clone:ro"]

  # And one with the GPU, which is what makes the cluster heterogeneous.
  # Eleven gigabytes of torch and CUDA, so it is **not** part of a plain `up`:
  #     docker compose --profile gpu up -d worker-gpu
  worker-gpu:
    profiles: ["gpu"]
    build: &torch
      context: ../../../..
      dockerfile: python/tests/cluster/docker/worker.Dockerfile
      additional_contexts:
        fabric: ../../../../../soma-fabric
      target: worker-gpu
    command: *keeping
    ports: ["127.0.0.1:7004:7000"]
    devices: ["nvidia.com/gpu=all"]
    volumes: ["store:/store"]

  # A second one, from the same image, because **a worker holds one catalog**.
  # Two clients with different graphs on one worker is the second of them being
  # told to reconnect, and that is not a limitation to route around: a machine
  # searching a space needs a worker of its own, exactly as it would on Slurm.
  # It costs a container, not an image.
  worker-gpu-b:
    profiles: ["gpu"]
    build: *torch
    command: *keeping
    ports: ["127.0.0.1:7006:7000"]
    volumes: ["store:/store"]

volumes:
  store:
