[package]
name = "soma-next-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The direction is core <- store, never the other way: the core stays with no
# dependencies at all, and what knows how to hash and where bytes live is a
# library.
soma-next-core = { workspace = true, features = ["serde"] }
serde = { workspace = true }
# The records are JSON on purpose: what is stored has to be readable with `cat`,
# and that was a requirement before it was a format.
serde_json = "1"
sha2 = "0.10"
# MessagePack, the same choice the worker's protocol made and for the same
# reasons — measured there — but a separate decision: a wire has two ends from
# the same build, and a store outlives every binary that wrote into it.
rmp-serde = "1"

[dev-dependencies]
# The tests are another crate and see only the public API — including the core's
# `Keeper`, which is what this one implements.
soma-next-core = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit/main.rs"
