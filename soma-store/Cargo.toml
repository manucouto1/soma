[package]
name = "somatize-store"
version.workspace = true
edition.workspace = true
readme = "../README.md"
license.workspace = true
repository.workspace = true
description = "Remote DataStore backends (S3, Zarr) for the Soma computational graph runtime"

[dependencies]
somatize-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
s3 = ["dep:rust-s3", "dep:tokio"]
zarr = ["dep:object_store", "dep:tokio", "dep:zstd"]

[dependencies.rust-s3]
version = "0.35"
optional = true
default-features = false
features = ["tokio-rustls-tls"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt"]

[dependencies.object_store]
workspace = true
optional = true

[dependencies.zstd]
workspace = true
optional = true

[dev-dependencies]
tempfile = "3"
