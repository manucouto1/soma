[package]
name = "somatize-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "The graph, the plan of how to run it, and the engine that walks that plan."

[dependencies]
# Optional, and off by default: the core still compiles with nothing. Whoever
# has to put these types on a wire — `transport` — turns it on.
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]

[[test]]
name = "unit"
path = "tests/unit/main.rs"
